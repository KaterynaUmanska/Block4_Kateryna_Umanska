services:
  block4:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "7777:7777"
    environment:
      HOST: 0.0.0.0
      PORT: 7777
      MONGO_ADDRESS: mongodb://mongo:27017/block4
      RECORD_SERVICE_URL: ${RECORD_SERVICE_URL:-http://host.docker.internal:8080}
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongo:
    image: mongo:8.0.4
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data: